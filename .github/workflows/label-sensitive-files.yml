name: Label sensitive file changes

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - name: Add label when sensitive files change
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const label = '⚠️ SENSITIVE FILES CHANGED';
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const sensitiveFiles = new Set(['index.css', 'index.js']);
            const hasSensitiveChange = files.some(({ filename }) => sensitiveFiles.has(filename));

            if (hasSensitiveChange) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;

                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'D93F0B',
                  description: 'Alterações em arquivos sensíveis',
                });
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: [label],
              });
            }
